# Panel de control del proyecto - Churn Prediction
paths: 
  raw_data_path: "../data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  processed_data_path: "../data/processed/processed_data.csv"
  model_path: "../models/churn_model.pkl"

data_loader:
  test_size: 0.20          # El porcentaje de datos para prueba (20%)
  random_state: 42         # La semilla para que la división siempre sea igual

models:
  logistic_regression:
    C: 2.0                # Parámetro de regularización
    max_iter: 300         # Número máximo de iteraciones para converger

  random_forest:
    n_estimators: 100     # Número de árboles en el bosque
    max_depth: 5       # Profundidad máxima de los árboles
    random_state: 42     # Semilla para reproducibilidad

  svm:
    C: 2.0                # Parámetro de regularización
    kernel: 'rbf'        # Tipo de kernel a usars
